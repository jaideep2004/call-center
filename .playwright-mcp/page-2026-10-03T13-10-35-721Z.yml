          - paragraph [ref=f10e26]:
            - strong [ref=f10e27]: "Last Updated: September 23, 2026"
          - paragraph [ref=f10e28]: CoverageCalls.com ("CoverageCalls," "we," "us," or "our") respects your privacy and is committed to protecting the personal information you provide to us or that we collect when you visit our website, interact with our advertisements, submit information through our forms, or initiate a telephone call through our marketing campaigns.
          - paragraph [ref=f10e29]: This Privacy Policy explains what information we collect, how we use it, how we may share it, how we protect it, and the choices available to you.
          - paragraph [ref=f10e30]: By accessing or using CoverageCalls.com or interacting with our services, you acknowledge the practices described in this Privacy Policy.
          - paragraph [ref=f10e31]: "---"
          - paragraph
          - heading "1. Information We Collect" [level=2] [ref=f10e32]
          - paragraph
          - paragraph
          - heading "Information You Provide" [level=3] [ref=f10e33]
          - paragraph
          - paragraph [ref=f10e34]: "We may collect information that you voluntarily provide when you:"
          - paragraph
          - list [ref=f10e35]:
            - listitem [ref=f10e36]: Submit a form on our website
            - listitem [ref=f10e37]: Request information regarding Final Expense, burial insurance, or related insurance products
            - listitem [ref=f10e38]: Initiate an inbound telephone call through one of our advertisements or landing pages
            - listitem [ref=f10e39]: Contact us by telephone, email, or other communication methods
            - listitem [ref=f10e40]: Request information, assistance, or a connection with an insurance professional
            - listitem [ref=f10e41]: Communicate with CoverageCalls or one of our authorized business partners
            - paragraph
            - paragraph [ref=f10e42]: "Depending on how you interact with us, information may include:"
            - paragraph
            - listitem [ref=f10e43]: Name
            - listitem [ref=f10e44]: Telephone number
            - listitem [ref=f10e45]: Email address
            - listitem [ref=f10e46]: ZIP code
            - listitem [ref=f10e47]: State of residence
            - listitem [ref=f10e48]: Age or age range
            - listitem [ref=f10e49]: Insurance interests
            - listitem [ref=f10e50]: Information relevant to your request
            - listitem [ref=f10e51]: Communication preferences
            - listitem [ref=f10e52]: Information voluntarily provided during a telephone call
            - paragraph
            - paragraph
            - heading "Information Collected Automatically" [level=3] [ref=f10e53]
            - paragraph
            - paragraph [ref=f10e54]: "When you visit our website or interact with our digital advertising, we may automatically collect certain technical and usage information, including:"
            - paragraph
            - listitem [ref=f10e55]: IP address
            - listitem [ref=f10e56]: Browser type and version
            - listitem [ref=f10e57]: Device type
            - listitem [ref=f10e58]: Operating system
            - listitem [ref=f10e59]: Pages viewed
            - listitem [ref=f10e60]: Referring website or advertisement
            - listitem [ref=f10e61]: Date and time of visits
            - listitem [ref=f10e62]: General geographic information
            - listitem [ref=f10e63]: Website interaction and usage information
            - listitem [ref=f10e64]: Device identifiers and similar technical information
            - paragraph
            - paragraph [ref=f10e65]: We may collect this information through cookies, pixels, tags, scripts, analytics tools, and similar technologies.
            - paragraph [ref=f10e66]: "---"
            - paragraph
            - heading "2. Information Collected Through Consumer-Initiated Calls" [level=1] [ref=f10e67]
            - paragraph
            - paragraph [ref=f10e68]: CoverageCalls operates advertising and marketing campaigns designed to connect consumers who are interested in insurance products, including Final Expense and burial insurance, with participating insurance agencies, licensed insurance agents, call centers, or other authorized parties.
            - paragraph [ref=f10e69]: When you voluntarily initiate a telephone call through one of our advertisements, landing pages, websites, or other marketing channels, we may collect information associated with that call.
            - paragraph [ref=f10e70]: "This may include:"
            - paragraph
            - listitem [ref=f10e71]: Telephone number
            - listitem [ref=f10e72]: Caller identification information
            - listitem [ref=f10e73]: Call date and time
            - listitem [ref=f10e74]: Call duration
            - listitem [ref=f10e75]: Call routing information
            - listitem [ref=f10e76]: Campaign and advertisement source
            - listitem [ref=f10e77]: Geographic information
            - listitem [ref=f10e78]: Information voluntarily provided during the call
            - listitem [ref=f10e79]: Information necessary to determine whether the call meets applicable campaign requirements
            - paragraph
            - paragraph [ref=f10e80]: We may use this information to facilitate, route, monitor, measure, document, and improve our inbound call services.
            - paragraph [ref=f10e81]: "---"
            - paragraph
            - heading "3. Call Recording and Monitoring" [level=1] [ref=f10e82]
            - paragraph
            - paragraph [ref=f10e83]: "Telephone calls may be recorded, monitored, logged, or otherwise processed for purposes including:"
            - paragraph
            - listitem [ref=f10e84]: Quality assurance
            - listitem [ref=f10e85]: Compliance monitoring
            - listitem [ref=f10e86]: Training
            - listitem [ref=f10e87]: Fraud prevention
            - listitem [ref=f10e88]: Call verification
            - listitem [ref=f10e89]: Dispute resolution
            - listitem [ref=f10e90]: Campaign performance measurement
            - listitem [ref=f10e91]: Billing and reporting
            - listitem [ref=f10e92]: Service improvement
            - listitem [ref=f10e93]: Regulatory and legal compliance
            - paragraph
            - paragraph [ref=f10e94]: Where required by applicable law, we or our service providers will provide appropriate notice regarding call recording and obtain any required consent.
            - paragraph [ref=f10e95]: "---"
            - paragraph
            - heading "4. How We Use Information" [level=1] [ref=f10e96]
            - paragraph
            - paragraph [ref=f10e97]: "We may use personal information for the following purposes:"
            - paragraph
            - listitem [ref=f10e98]: Responding to inquiries and requests
            - listitem [ref=f10e99]: Connecting consumers with participating insurance agencies, licensed agents, call centers, or other authorized parties
            - listitem [ref=f10e100]: Routing consumer-initiated inbound calls
            - listitem [ref=f10e101]: Verifying and measuring call activity
            - listitem [ref=f10e102]: Managing and improving advertising campaigns
            - listitem [ref=f10e103]: Measuring advertising and campaign performance
            - listitem [ref=f10e104]: Providing reporting to authorized business partners
            - listitem [ref=f10e105]: Maintaining call quality and compliance standards
            - listitem [ref=f10e106]: Detecting and preventing fraud, abuse, or unauthorized activity
            - listitem [ref=f10e107]: Operating, maintaining, and improving our website and technology
            - listitem [ref=f10e108]: Communicating with consumers regarding their requests
            - listitem [ref=f10e109]: Responding to privacy or customer-service requests
            - listitem [ref=f10e110]: Maintaining business and transaction records
            - listitem [ref=f10e111]: Complying with applicable laws and regulations
            - listitem [ref=f10e112]: Protecting our legal rights, property, systems, and users
            - paragraph
            - paragraph [ref=f10e113]: "---"
            - paragraph
            - heading "5. How We Share Information" [level=1] [ref=f10e114]
            - paragraph
            - paragraph [ref=f10e115]: We may share personal information with third parties when reasonably necessary to provide or operate our services.
            - paragraph [ref=f10e116]: "These parties may include:"
            - paragraph
            - heading "Insurance Agencies and Licensed Professionals" [level=3] [ref=f10e117]
            - paragraph
            - paragraph [ref=f10e118]: If you request information about insurance or initiate a call through one of our campaigns, information associated with your request or call may be provided to participating insurance agencies, licensed insurance agents, call centers, or other authorized recipients so that they may respond to your request.
            - paragraph
            - heading "Service Providers" [level=3] [ref=f10e119]
            - paragraph
            - paragraph [ref=f10e120]: "We may share information with vendors and service providers that help us operate our business, including providers of:"
            - paragraph
            - listitem [ref=f10e121]: Telephony and call-routing services
            - listitem [ref=f10e122]: Call tracking
            - listitem [ref=f10e123]: Analytics
            - listitem [ref=f10e124]: Hosting and cloud infrastructure
            - listitem [ref=f10e125]: Advertising and marketing technology
            - listitem [ref=f10e126]: Customer relationship management systems
            - listitem [ref=f10e127]: Data security
            - listitem [ref=f10e128]: Fraud prevention
            - listitem [ref=f10e129]: Compliance and consent management
            - listitem [ref=f10e130]: Business and administrative services
            - paragraph
            - paragraph [ref=f10e131]: These service providers are permitted to use information only as necessary to perform services for us or as otherwise permitted by law.
            - paragraph
            - heading "Legal and Regulatory Requirements" [level=3] [ref=f10e132]
            - paragraph
            - paragraph [ref=f10e133]: "We may disclose information when we reasonably believe disclosure is necessary to:"
            - paragraph
            - listitem [ref=f10e134]: Comply with applicable law or regulation
            - listitem [ref=f10e135]: Respond to legal process, subpoena, or governmental request
            - listitem [ref=f10e136]: Protect our rights or property
            - listitem [ref=f10e137]: Investigate fraud or security issues
            - listitem [ref=f10e138]: Enforce our agreements
            - listitem [ref=f10e139]: Protect the safety of our users, business partners, or others
            - paragraph
            - paragraph
            - heading "Business Transfers" [level=3] [ref=f10e140]
            - paragraph
            - paragraph [ref=f10e141]: If CoverageCalls or substantially all of its assets are acquired, merged, reorganized, financed, or transferred, personal information may be transferred as part of that transaction, subject to applicable law.
            - paragraph [ref=f10e142]: "---"
            - paragraph
            - heading "6. We Do Not Sell Personal Information" [level=1] [ref=f10e143]
            - paragraph
            - paragraph [ref=f10e144]: CoverageCalls does not sell personal information for monetary consideration.
            - paragraph [ref=f10e145]: We may, however, share information with business partners and service providers as described in this Privacy Policy for purposes such as fulfilling a consumer request, routing an inbound call, operating advertising campaigns, providing services, analytics, security, compliance, and other legitimate business purposes.
            - paragraph [ref=f10e146]: "---"
            - paragraph
            - heading "7. Advertising, Cookies, and Tracking Technologies" [level=1] [ref=f10e147]
            - paragraph
            - paragraph [ref=f10e148]: "We may use cookies, pixels, web beacons, tags, scripts, and similar technologies to:"
            - paragraph
            - listitem [ref=f10e149]: Operate our website
            - listitem [ref=f10e150]: Remember preferences
            - listitem [ref=f10e151]: Understand website usage
            - listitem [ref=f10e152]: Measure advertising performance
            - listitem [ref=f10e153]: Improve marketing campaigns
            - listitem [ref=f10e154]: Analyze website traffic
            - listitem [ref=f10e155]: Detect fraudulent or abusive activity
            - listitem [ref=f10e156]: Improve user experience
            - paragraph
            - paragraph [ref=f10e157]: Third-party advertising, analytics, and technology providers may also use similar technologies when you interact with our website or advertisements.
            - paragraph [ref=f10e158]: You may be able to control or restrict cookies through your browser settings. Disabling certain cookies may affect the functionality of portions of our website.
            - paragraph [ref=f10e159]: "---"
            - paragraph
            - heading "8. Consumer Choices and Privacy Requests" [level=1] [ref=f10e160]
            - paragraph
            - paragraph [ref=f10e161]: "Depending on applicable law, you may have the right to request:"
            - paragraph
            - listitem [ref=f10e162]: Access to personal information we maintain about you
            - listitem [ref=f10e163]: Correction of inaccurate personal information
            - listitem [ref=f10e164]: Deletion of personal information
            - listitem [ref=f10e165]: Information regarding how your personal information is used or shared
            - listitem [ref=f10e166]: Restriction of certain uses of your information
            - listitem [ref=f10e167]: Withdrawal of certain consents, where applicable
            - paragraph
            - paragraph [ref=f10e168]: To make a privacy request, please contact us using the information provided below.
            - paragraph [ref=f10e169]: We may need to verify your identity before completing certain requests.
            - paragraph [ref=f10e170]: Certain information may be retained where necessary to comply with legal, regulatory, contractual, security, accounting, or legitimate business requirements.
            - paragraph [ref=f10e171]: "---"
            - paragraph
            - heading "9. Marketing and Communications" [level=1] [ref=f10e172]
            - paragraph
            - paragraph [ref=f10e173]: If you voluntarily provide your contact information or initiate an inquiry through one of our campaigns, you may be contacted by CoverageCalls, participating insurance professionals, or authorized service providers regarding your request.
            - paragraph [ref=f10e174]: Communications may include telephone calls, text messages, emails, or other communications where permitted by applicable law and based on the applicable consent or authorization.
            - paragraph [ref=f10e175]: Submitting information does not guarantee that you will qualify for or receive an insurance product, quote, policy, or offer.
            - paragraph [ref=f10e176]: "---"
            - paragraph
            - heading "10. Data Retention" [level=1] [ref=f10e177]
            - paragraph
            - paragraph [ref=f10e178]: "We retain personal information for as long as reasonably necessary to:"
            - paragraph
            - listitem [ref=f10e179]: Provide and administer our services
            - listitem [ref=f10e180]: Maintain business and transaction records
            - listitem [ref=f10e181]: Meet contractual obligations
            - listitem [ref=f10e182]: Satisfy legal and regulatory requirements
            - listitem [ref=f10e183]: Resolve disputes
            - listitem [ref=f10e184]: Prevent fraud and abuse
            - listitem [ref=f10e185]: Enforce our agreements
            - listitem [ref=f10e186]: Maintain appropriate compliance and audit records
            - paragraph
            - paragraph [ref=f10e187]: When information is no longer reasonably required, we may delete, anonymize, or de-identify it in accordance with our policies and applicable law.
            - paragraph [ref=f10e188]: "---"
            - paragraph
            - heading "11. Data Security" [level=1] [ref=f10e189]
            - paragraph
            - paragraph [ref=f10e190]: We use reasonable administrative, technical, and organizational safeguards designed to protect personal information from unauthorized access, disclosure, alteration, or destruction.
            - paragraph [ref=f10e191]: However, no website, telecommunications system, database, or method of transmitting information over the Internet is completely secure.
            - paragraph [ref=f10e192]: Accordingly, we cannot guarantee the absolute security of your information.
            - paragraph [ref=f10e193]: "---"
            - paragraph
            - heading "12. Third-Party Websites and Services" [level=1] [ref=f10e194]
            - paragraph
            - paragraph [ref=f10e195]: Our website or advertisements may contain links to websites, applications, services, or resources operated by third parties.
            - paragraph [ref=f10e196]: CoverageCalls does not control the privacy practices of third-party websites or services.
            - paragraph [ref=f10e197]: We encourage you to review the privacy policies of any third party before providing them with personal information.
            - paragraph [ref=f10e198]: "---"
            - paragraph
            - heading "13. Children's Privacy" [level=1] [ref=f10e199]
            - paragraph
            - paragraph [ref=f10e200]: CoverageCalls services are not directed toward children under the age of 18.
            - paragraph [ref=f10e201]: We do not knowingly collect personal information from children under 18.
            - paragraph [ref=f10e202]: If we become aware that we have collected personal information from a child under 18, we will take reasonable steps to delete the information as required by applicable law.
            - paragraph [ref=f10e203]: "---"
            - paragraph
            - heading "14. Insurance Disclaimer" [level=1] [ref=f10e204]
            - paragraph
            - paragraph [ref=f10e205]: CoverageCalls is a marketing and inbound call-generation platform and is not an insurance carrier.
            - paragraph [ref=f10e206]: CoverageCalls does not itself issue insurance policies or make underwriting decisions.
            - paragraph [ref=f10e207]: Insurance products, eligibility, premiums, benefits, coverage, and policy terms are determined by the applicable insurance carrier and/or licensed insurance professional.
            - paragraph [ref=f10e208]: CoverageCalls does not guarantee that a consumer will qualify for any particular insurance product or receive a particular price, benefit, policy, or offer.
            - paragraph [ref=f10e209]: "---"
            - paragraph
            - heading "15. Compliance" [level=1] [ref=f10e210]
            - paragraph
            - paragraph [ref=f10e211]: CoverageCalls seeks to operate its consumer acquisition and inbound call programs in accordance with applicable federal and state laws and regulations.
            - paragraph [ref=f10e212]: Our advertising and call-generation programs may include processes designed to document consumer consent, track campaign sources, verify call activity, maintain appropriate records, and support applicable compliance requirements.
            - paragraph [ref=f10e213]: Compliance requirements may vary depending on the campaign, state, insurance product, traffic source, and participating business partner.
            - paragraph [ref=f10e214]: "---"
            - paragraph
            - heading "16. State Privacy Rights" [level=1] [ref=f10e215]
            - paragraph
            - paragraph [ref=f10e216]: Certain states provide residents with additional privacy rights regarding their personal information.
            - paragraph [ref=f10e217]: Depending on your state of residence and applicable law, you may have additional rights concerning access, correction, deletion, portability, or restriction of certain uses or disclosures of your personal information.
            - paragraph [ref=f10e218]: If you believe you are entitled to additional rights under applicable state privacy law, you may contact us using the information below.
            - paragraph [ref=f10e219]: We will evaluate and respond to qualifying requests in accordance with applicable law.
            - paragraph [ref=f10e220]: "---"
            - paragraph
            - heading "17. Purchased Inbound Calls and Leads — No-Refund Policy" [level=1] [ref=f10e221]
            - paragraph
            - paragraph [ref=f10e222]: CoverageCalls provides consumer-generated inbound calls and leads to participating agents, agencies, call centers, and other authorized buyers ("Buyers").
            - paragraph [ref=f10e223]:
              - strong [ref=f10e224]: ALL PURCHASED, ACCEPTED, RECEIVED, OR DELIVERED INBOUND CALLS AND LEADS ARE STRICTLY NON-REFUNDABLE
              - text: ", except where CoverageCalls expressly determines that a specific call or lead failed to satisfy the applicable campaign requirements or otherwise agrees to a credit or adjustment in writing."
            - paragraph [ref=f10e225]: Once an inbound call or lead has been delivered to, accepted by, or made available to the Buyer in accordance with the applicable campaign terms, the applicable charge becomes due.
            - paragraph
            - heading "No Refunds Based on Sales Performance" [level=3] [ref=f10e226]
            - paragraph
            - paragraph [ref=f10e227]: "A Buyer will not be entitled to a refund, credit, chargeback, or payment reversal solely because:"
            - paragraph
            - listitem [ref=f10e228]: The consumer did not purchase an insurance policy
            - listitem [ref=f10e229]: The consumer did not submit an application
            - listitem [ref=f10e230]: The consumer changed their mind
            - listitem [ref=f10e231]: The consumer was unavailable for follow-up
            - listitem [ref=f10e232]: The consumer did not meet the Buyer's internal sales criteria
            - listitem [ref=f10e233]: The consumer declined an insurance offer
            - listitem [ref=f10e234]: The Buyer or its agent was unable to close the consumer
            - listitem [ref=f10e235]: The Buyer's agent failed to answer or accept the call
            - listitem [ref=f10e236]: The Buyer's call center was unavailable
            - listitem [ref=f10e237]: The Buyer's system, telephone, routing, or technical infrastructure failed
            - listitem [ref=f10e238]: The Buyer did not follow up with the consumer
            - listitem [ref=f10e239]: The Buyer did not have sufficient staffing
            - listitem [ref=f10e240]: The Buyer's conversion rate or sales performance was below expectations
            - paragraph
            - paragraph [ref=f10e241]: CoverageCalls does not guarantee that any individual call or lead will result in a sale, application, policy issuance, commission, or revenue.
            - paragraph
            - heading "Buyer Responsibility" [level=3] [ref=f10e242]
            - paragraph
            - paragraph [ref=f10e243]: Buyers are responsible for ensuring that their agents, call centers, telephone systems, routing systems, CRM systems, and other receiving infrastructure are operational and capable of receiving traffic during applicable campaign hours.
            - paragraph [ref=f10e244]: If a Buyer has an active campaign and a qualifying inbound call or lead is delivered or accepted according to the applicable campaign requirements, the applicable charge will apply regardless of whether the Buyer ultimately converts the consumer.
            - paragraph
            - heading "Valid Disputes" [level=3] [ref=f10e245]
            - paragraph
            - paragraph [ref=f10e246]: If a Buyer believes that a specific call or lead materially failed to meet the agreed campaign requirements, the Buyer must submit a dispute within the timeframe specified in the applicable Buyer Agreement, Master Services Agreement, Insertion Order ("IO"), campaign terms, or other written agreement.
            - paragraph [ref=f10e247]: "Where applicable, a dispute should include:"
            - paragraph
            - listitem [ref=f10e248]: Call ID or lead ID
            - listitem [ref=f10e249]: Telephone number
            - listitem [ref=f10e250]: Date and time of the call or lead
            - listitem [ref=f10e251]: Campaign identification
            - listitem [ref=f10e252]: Specific reason for the dispute
            - listitem [ref=f10e253]: Supporting information reasonably necessary for CoverageCalls to investigate the dispute
          - paragraph
          - paragraph [ref=f10e254]: Submission of a dispute does not automatically entitle the Buyer to a refund or credit.
          - paragraph [ref=f10e255]: CoverageCalls will review qualifying disputes in accordance with the applicable campaign terms and may, at its discretion, issue a credit or other adjustment where a billing, delivery, routing, or campaign-qualification error is verified.
          - paragraph
          - heading "Chargebacks and Payment Reversals" [level=3] [ref=f10e256]
          - paragraph
          - paragraph [ref=f10e257]: Buyers agree not to initiate a chargeback, payment reversal, or other payment dispute solely because a purchased call or lead did not result in a sale or because the Buyer's agent was unable or unwilling to convert the consumer.
          - paragraph [ref=f10e258]: Any unauthorized chargeback or payment reversal may be treated as a breach of the applicable Buyer Agreement or campaign terms, subject to applicable law.
          - paragraph [ref=f10e259]: CoverageCalls reserves the right to suspend or terminate a Buyer's account or campaign access following an unauthorized payment reversal or repeated improper disputes.
          - paragraph
          - heading "Commercial Agreements Control" [level=3] [ref=f10e260]
          - paragraph
          - paragraph [ref=f10e261]: Where a separate Buyer Agreement, Master Services Agreement, Insertion Order, Campaign Agreement, or other written agreement exists between CoverageCalls and a Buyer, the commercial terms of that agreement—including pricing, qualification requirements, dispute procedures, billing terms, and any applicable refund or credit provisions—will control to the extent of any conflict with this Privacy Policy.
          - paragraph [ref=f10e262]: Nothing in this Privacy Policy limits any rights or obligations that cannot lawfully be waived under applicable law.
          - paragraph [ref=f10e263]: "---"
          - paragraph
          - heading "18. Changes to This Privacy Policy" [level=1] [ref=f10e264]
          - paragraph
          - paragraph [ref=f10e265]: We may update this Privacy Policy periodically to reflect changes in our services, technology, business practices, legal requirements, or regulatory obligations.
          - paragraph [ref=f10e266]: When we make changes, we will update the "Last Updated" date at the top of this page.
          - paragraph [ref=f10e267]: We encourage you to review this Privacy Policy periodically.
          - paragraph [ref=f10e268]: "---"
          - paragraph
          - heading "19. Contact Us" [level=1] [ref=f10e269]
          - paragraph
          - paragraph [ref=f10e270]: "If you have questions about this Privacy Policy, want to make a privacy request, or have concerns about how your information is handled, please contact us:"
