services:
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
  worker:
    build: .
    command: npm run worker
    env_file: .env
  gateway:
    build: .
    command: npm run gateway
    env_file: .env
    ports: ["3001:3001"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
